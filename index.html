<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumi Empire - Cartographie</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* BANDE GLOBALE : EFFET COULEUR ACIER / ALU BROSSE NETTEMENT PLUS CLAIR */
        .main-header {
            width: 100%;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #444444 0%, #2a2a2a 50%, #1c1c1c 100%);
            border-bottom: 3px solid #ff0000;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .main-header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            opacity: 0.9;
        }

        /* BLOC GAUCHE : TITRE */
        .logo-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2;
        }
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* GRILLE DES RESEAUX AVEC CONTOUR ROUGE PERMANENT */
        .social-grid {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .social-bubble {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #111111;
            border: 1.5px solid #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff !important;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.25s ease;
        }
        
        .social-bubble svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
            transition: fill 0.25s ease;
        }

        .social-bubble:hover {
            background-color: #00d2ff;
            border-color: #00d2ff;
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.7);
        }
        .social-bubble:hover i {
            color: #111111 !important;
        }
        .social-bubble:hover svg {
            fill: #111111;
        }

        /* BLOC CENTRAL : BOUTONS INDIVIDUELS SÉPARÉS */
        .nav-menu {
            display: flex;
            gap: 12px; 
            z-index: 2;
        }
        .nav-item {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            padding: 10px 18px;
            background: #111111;
            border-radius: 6px;
            border: 2px solid #ff0000;
            letter-spacing: 1px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.25s ease;
        }
        
        .nav-item:hover {
            border-color: #00d2ff;
            color: #00d2ff;
            background: #000000;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        /* BLOC DROITE : ACTIONNEURS */
        .user-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }
        .notification-bell {
            font-size: 18px;
            color: #ffffff;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .notification-bell:hover {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }
        .user-profile-trigger {
            display: flex;
            align-items: center;
            background: #111111;
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #ff0000;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .user-profile-trigger:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0,210,255,0.5);
        }
        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .user-profile-trigger:hover .profile-avatar {
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <header class="main-header">
        
        <div class="logo-container">
            <h1 class="brand-title">L'Empire Kai-Ji</h1>
            <div class="social-grid">
                <a href="#" class="social-bubble" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="#" class="social-bubble" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-bubble" title="Pinterest"><i class="fab fa-pinterest"></i></a>
                <a href="#" class="social-bubble" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                
                <a href="#" class="social-bubble" title="X (Twitter)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                    </svg>
                </a>
                
                <a href="#" class="social-bubble" title="Snapchat"><i class="fab fa-snapchat-ghost"></i></a>
                <a href="#" class="social-bubble" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="social-bubble" title="Messenger"><i class="fab fa-facebook-messenger"></i></a>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-item">Accueil</a>
            <a href="#" class="nav-item">Moteur Rotatif</a>
            <a href="#" class="nav-item">Conseils</a>
            <a href="#" class="nav-item">Actualités</a>
            <a href="#" class="nav-item">Mes Abonnements</a>
            <a href="#" class="nav-item">Contact</a>
            <a href="#" class="nav-item">À Propos</a>
            <a href="#" class="nav-item">Propulser l'Empire</a>
        </nav>

        <div class="user-panel">
            <div class="notification-bell" title="Notifications">
                <i class="fas fa-bell"></i>
            </div>
            <div class="user-profile-trigger" title="Menu Utilisateur">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>

    </header>

</body>
</html>
