<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumi Empire - Cartographie</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* BANDE GLOBALE REHAUSSÉE ET ÉLARGIE POUR ACCUEILLIR LES 9 BULLES */
        .main-header {
            width: 100%;
            padding: 26px 30px; /* Élargissement de la bande */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #444444 0%, #2a2a2a 50%, #1c1c1c 100%);
            border-bottom: 3px solid #ff0000;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .main-header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            opacity: 0.9;
        }

        /* BLOC GAUCHE : TYPOGRAPHIE BOOSTÉE ET GROSSIE POUR KAI-JI */
        .logo-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 2;
        }
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900; /* Version maximale */
            font-size: 29px;  /* Écriture plus grosse et imposante */
            color: #ffffff;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: default;
        }
        .brand-title:hover {
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.9), 0 0 40px rgba(0, 210, 255, 0.5);
            transform: scale(1.02);
        }

        /* GRILLE DES 9 RÉSEAUX SOCIAUX CONTOUR ROUGE */
        .social-grid {
            display: flex;
            gap: 7px;
            align-items: center;
        }
        .social-bubble {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #111111;
            border: 1.5px solid #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff !important;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.25s ease;
        }
        
        .social-bubble svg {
            width: 13px;
            height: 13px;
            fill: #ffffff;
            transition: fill 0.25s ease;
        }

        .social-bubble:hover {
            background-color: #00d2ff;
            border-color: #00d2ff;
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.7);
        }
        .social-bubble:hover i {
            color: #111111 !important;
        }
        .social-bubble:hover svg {
            fill: #111111;
        }

        /* BLOC CENTRAL : MENU COMPLET */
        .nav-menu {
            display: flex;
            gap: 12px; 
            z-index: 2;
        }
        .nav-item {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            padding: 10px 18px;
            background: #111111;
            border-radius: 6px;
            border: 2px solid #ff0000;
            letter-spacing: 1px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.25s ease;
        }
        
        .nav-item:hover {
            border-color: #00d2ff;
            color: #00d2ff;
            background: #000000;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        /* BLOC DROITE : ACTIONNEURS & MENU UTILISATEUR COMPLET */
        .user-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }
        .notification-bell {
            font-size: 18px;
            color: #ffffff;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .notification-bell:hover {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }
        .user-profile-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111111;
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #ff0000;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .user-profile-trigger:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0,210,255,0.5);
        }
        .profile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: color 0.3s ease;
        }
        .user-profile-trigger:hover .profile-avatar {
            color: #00d2ff;
        }
        .fa-chevron-down {
            font-size: 11px;
            color: #ffffff;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .user-profile-trigger:hover .fa-chevron-down {
            color: #00d2ff;
            transform: translateY(2px);
        }
        /* Effet néon clignotant */
.neon-effect:hover {
  animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
  0% { opacity: 1; }
  50% { opacity: 0.6; }
  100% { opacity: 1; }
}

/* Le Logo Rotor */
.rotor-logo {
  width: 200px;
  height: 200px;
  background-image: url('ton_logo_rotor.png');
  transform: rotate(90deg); /* Rotation validée */
  transition: transform 0.3s;
}

/* Interaction Voiture (bruit futur) */
.car-interactive:hover {
  cursor: pointer;
  filter: drop-shadow(0 0 10px #00f);
}
    </style>
</head>
<body>

    <header class="main-header">
        
        <div class="logo-container">
            <h1 class="brand-title">L'Empire Kai-Ji</h1>
            <div class="social-grid">
                <a href="#" class="social-bubble" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" class="social-bubble" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="#" class="social-bubble" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-bubble" title="Snapchat"><i class="fab fa-snapchat-ghost"></i></a>
                <a href="#" class="social-bubble" title="Pinterest"><i class="fab fa-pinterest"></i></a>
                
                <a href="#" class="social-bubble" title="X (Twitter)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                    </svg>
                </a>
                
                <a href="#" class="social-bubble" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-bubble" title="Messenger"><i class="fab fa-facebook-messenger"></i></a>
                <a href="#" class="social-bubble" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-item">Accueil</a>
            <a href="#" class="nav-item">Moteur Rotatif</a>
            <a href="#" class="nav-item">Conseils</a>
            <a href="#" class="nav-item">Actualités</a>
            <a href="#" class="nav-item">Mes Abonnements</a>
            <a href="#" class="nav-item">Contact</a>
            <a href="#" class="nav-item">À Propos</a>
            <a href="#" class="nav-item">Propulser l'Empire</a>
        </nav>

        <div class="user-panel">
            <div class="notification-bell" title="Notifications">
                <i class="fas fa-bell"></i>
            </div>
            <div class="user-profile-trigger" title="Menu Utilisateur">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>

    </header>

    </div>
  </div>
    <div class="showroom">
  <aside class="left-panel">
    <div id="conseil-sage" class="interactive-box">CONSEIL DU SAGE - RESET PCM</div>
    <div class="brand-text">
      <h1>KYO<br>YUMI<br>GABY</h1>
      <p>MAZDA RX8 PERFORMANCE 231</p>
    </div>
    <div id="play-button" class="interactive-box">
      <span>▶ PRÉSENTATION DE LA VOITURE</span>
    </div>
    <div id="ad-panel" class="interactive-box">YOUR BRAND HERE</div>
  </aside>

  <main class="car-area">
    <div id="car-model" class="car-interactive"></div>
    <div id="rotor-logo" class="rotor-logo"></div>
  </main>
</div>
</body>
</html>
