<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumi Empire - Cartographie</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d0d;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* BANDE GLOBALE : TEXTURE METAL ET LIGNE DE RAPPEL ROUGE */
        .main-header {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #252525 0%, #181818 50%, #101010 100%);
            border-bottom: 2px solid #ff0000;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 32px rgba(0,0,0,0.9);
            position: relative;
        }

        .main-header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            opacity: 0.8;
        }

        /* BLOC GAUCHE : L'EMPIRE KAI-JI */
        .logo-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2;
        }
        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .brand-title:hover {
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8), 0 0 30px rgba(0, 210, 255, 0.4);
        }

        /* BULLES RESEAUX SOCIAUX CONTOUR ROUGE -> SURVOL BLEU */
        .social-grid {
            display: flex;
            gap: 8px;
        }
        .social-bubble {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #141414;
            border: 1.5px solid #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff !important; /* Force le blanc pour toutes les icônes */
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* Correction spécifique pour le X afin qu'il soit blanc et visible */
        .social-bubble i {
            color: #ffffff !important;
            display: inline-block;
        }
        .social-bubble:hover {
            background-color: #00d2ff;
            border-color: #00d2ff;
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }
        .social-bubble:hover i {
            color: #000000 !important; /* L'icône passe en noir au survol pour trancher sur le bleu */
        }

        /* BLOC CENTRAL : BOUTONS INDIVIDUELS ECLATES */
        .nav-menu {
            display: flex;
            gap: 10px; /* Espace entre chaque bouton */
            z-index: 2;
            background: transparent; /* Suppression du gros bloc conteneur unique */
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .nav-item {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            padding: 10px 16px;
            background: rgba(15, 15, 15, 0.8);
            border-radius: 6px;
            border: 1.5px solid #ff0000; /* Cerclage rouge individuel permanent */
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* Effet néon bleu électrique au survol de chaque bouton */
        .nav-item:hover {
            border-color: #00d2ff;
            color: #00d2ff;
            background: rgba(0, 0, 0, 0.9);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            transform: translateY(-2px);
        }

        /* BLOC DROITE : ESPACE MEMBRE ROUGE -> BLEU */
        .user-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }
        .notification-bell {
            font-size: 18px;
            color: #ffffff;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease;
        }
        .notification-bell:hover {
            color: #00d2ff;
            transform: rotate(15deg);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
        }
        .user-profile-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #111111;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1.5px solid #ff0000;
            transition: all 0.3s ease;
        }
        .user-profile-trigger:hover {
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 12px rgba(0,210,255,0.4);
        }
        .profile-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #222222;
            border: 1px solid #444444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
        }
        .user-profile-trigger:hover .profile-avatar {
            color: #00d2ff;
            border-color: #00d2ff;
        }
        .fa-chevron-down {
            font-size: 11px;
            color: #ffffff;
            transition: transform 0.3s ease;
        }
        .user-profile-trigger:hover .fa-chevron-down {
            color: #00d2ff;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <header class="main-header">
        
        <div class="logo-container">
            <h1 class="brand-title">L'Empire Kai-Ji</h1>
            <div class="social-grid">
                <a href="#" class="social-bubble" title="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="#" class="social-bubble" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-bubble" title="Pinterest"><i class="fab fa-pinterest"></i></a>
                <a href="#" class="social-bubble" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-bubble" title="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
                <a href="#" class="social-bubble" title="Snapchat"><i class="fab fa-snapchat-ghost"></i></a>
                <a href="#" class="social-bubble" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="social-bubble" title="Messenger"><i class="fab fa-facebook-messenger"></i></a>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-item">Accueil</a>
            <a href="#" class="nav-item">À Propos</a>
            <a href="#" class="nav-item">Conseils</a>
            <a href="#" class="nav-item">Actualités</a>
            <a href="#" class="nav-item">Contact</a>
            <a href="#" class="nav-item">Faire un Don</a>
            <a href="#" class="nav-item">Moteur Rotatif</a>
            <a href="#" class="nav-item">Mes Abonnements</a>
        </nav>

        <div class="user-panel">
            <div class="notification-bell" title="Notifications">
                <i class="fas fa-bell"></i>
            </div>
            <div class="user-profile-trigger" title="Menu Utilisateur">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>

    </header>

</body>
</html>
